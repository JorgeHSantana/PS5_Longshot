# The light checks of every pull request to main and every push to it (docs/dev/reference/ci.md): the pull request's
# title; the Rust workspace's checks (rustfmt, clippy, cargo test: longshot-builder's crates, its lifter among them, and
# longshot-rs, with the distribution's clang, lld and llvm-mc for the tests that compile, link and disassemble); the builder end to end on a
# synthetic game; the host's C compiled for Windows (scripts/check_host_compile.py, with llvm-mingw); actionlint; the
# website's checks. No game data is involved. tests/run_all.py's game-free checks and the shader recompiler fixtures run
# on CircleCI (.circleci/), not here. There is no Windows runner: what only Windows can check is in
# docs/dev/reference/releases.md, "Windows tester". Caches are read by every run and written only by a push to main, so a
# pull request never writes what another reads (docs/dev/reference/ci.md, Caches). Main's tree is one: the jobs on a
# runner outside the server seed their checkout with it (scripts/ci_git_base.sh), since git.magicbean.dev's whole tree
# took them minutes to fetch; the registry crates' builds, without the workspace's own (scripts/ci_cargo_prune.py), restored
# from the newest entry for the same Rust when Cargo.lock has changed; mise.toml's Rust toolchain (~/.rustup); apt's lists
# and packages (scripts/ci_apt.sh); the downloads. A pull request that changes only the site, the docs or the other CIs'
# files skips the compiling jobs (job changes, scripts/ci_changes.py); a push to main runs every job. A pull request's
# newer push cancels its older run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # (CI builds each crate once: no incremental state, which would only be written, never read. No debug info in the
  # checks' dev builds: they link faster and the dependencies' cache is smaller, and a failing test still names its file
  # and line. The end-to-end test's --release keeps the release profile's line tables)
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  # (a squash-merged pull request's title is its commit on main, a line of the next release's notes, and what decides the next
  # version: a Conventional Commit, by scripts/check_pr_description.py's TITLE, which `forge.py pr create` checks too. Only the title is
  # read, from the event: the pull request's code is not run for it)
  title:
    name: Conventional Commit title
    if: github.event_name == 'pull_request'
    runs-on: quick  # (a quick job: the runner kept free for these takes it, or any runner with room)
    timeout-minutes: 5
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: The title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -I - <<'PY'
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location("check", "scripts/check_pr_description.py")
          check = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(check)
          # (without Forgejo's work-in-progress prefixes, as forge.py and the description check take them off)
          title = check.strip_wip(os.environ["TITLE"])
          if not check.TITLE.match(title):
              print("::error::the title must be a Conventional Commit, type(scope): description, with the type one of %s "
                    "(docs/dev/standards.md, Titles): %r" % (", ".join(check.TYPES), title))
              sys.exit(1)
          print("ok: %s" % title)
          PY

  # (whether rust, e2e and host-windows are needed: on a pull request, not when it changes only the site, the docs or
  # the other CIs' files (scripts/ci_changes.py; anything unsure runs them). A push or a run by hand runs everything. A
  # job not needed shows as skipped, which Forgejo and forge.py count as passed. Only the file list is read, from the
  # API, with the base's script: the pull request's code is not run for it)
  changes:
    name: What the change needs
    runs-on: quick  # (a quick job: the runner kept free for these takes it, or any runner with room)
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code || 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - id: files
        if: github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f scripts/ci_changes.py ]; then
            python3 -I scripts/ci_changes.py --server "${{ github.server_url }}" --repo "${{ github.repository }}" --pr "$PR_NUMBER"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"   # (a base from before the script: everything runs)
          fi

  # (the Rust workspace's checks: longshot-builder's crates, its lifter among them, and longshot-rs, as `mise run rust` runs
  # them. build-compile's compile_link test compiles and links with clang and ld.lld, a64's llvm_mc test compares the
  # decoder with llvm-mc: both fail when their tool is missing (LONGSHOT_NO_CLANG=1 skips them, never here), so the
  # distribution's clang, lld and llvm are installed and LLVM_MC names llvm-mc. tools.lock's llvm is trimmed to the
  # compile's tools and has no llvm-mc)
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rust (rustfmt, clippy, cargo test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # (main's tree from this runner's cache, so that checkout fetches only what the commit adds; anything amiss, and it
      # fetches all as before: scripts/ci_git_base.sh)
      - uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-base
          key: git-base
      - name: Seed the checkout
        env:
          BASE: ${{ runner.temp }}/git-base
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tip=$(git --git-dir="$BASE" rev-parse -q --verify 'refs/heads/base^{commit}' 2> /dev/null) || exit 0
          if git init -q . && git remote add origin "$ORIGIN" && cp "$BASE/shallow" .git/shallow &&
            echo "$BASE/objects" > .git/objects/info/alternates && git update-ref --no-deref HEAD "$tip"; then
            echo "main's ${tip:0:12} as the checkout's base"
          else
            rm -rf .git
          fi
      - name: Check out source
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The checkout's own objects
        run: scripts/ci_git_base.sh dissociate
      - name: main's tree for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/ci_git_base.sh save
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-base
          key: git-base
      # (mise.toml's pinned Rust, through a checksum-pinned rustup: scripts/ci_rust.sh. ~/.rustup and cargo's bin/ are
      # kept per runner for that version, written only by a push to main: with them, ci_rust.sh finds the toolchain
      # installed and downloads nothing)
      - name: The Rust version
        id: rust
        run: echo "version=$(sed -n 's/^rust = { version = "\([0-9.]*\)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - id: rustup-cache
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-${{ steps.rust.outputs.version }}-rust
      - name: Rust (mise.toml's; rustfmt and clippy)
        run: scripts/ci_rust.sh rustfmt,clippy
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rustup-cache.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-${{ steps.rust.outputs.version }}-rust
      # (the distribution's packages, with apt's lists and downloads kept per runner by the month, written only by a push
      # to main: scripts/ci_apt.sh)
      - name: The apt cache's key
        id: apt
        run: echo "key=apt-rust-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: apt-cache
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-rust-
      - name: clang, lld and llvm-mc
        run: |
          if ! command -v clang > /dev/null || ! command -v ld.lld > /dev/null || ! command -v llvm-mc > /dev/null; then
            scripts/ci_apt.sh "$RUNNER_TEMP/apt" clang lld llvm
          fi
          mc=$(command -v llvm-mc || find /usr/lib -path '/usr/lib/llvm-*/bin/llvm-mc' 2>/dev/null | sort -V | tail -1)
          if [ -z "$mc" ] || ! "$mc" --version > /dev/null; then echo "::error::no llvm-mc"; exit 1; fi
          clang --version && ld.lld --version
          echo "LLVM_MC=$mc" >> "$GITHUB_ENV"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}
      # (the registry crates, downloaded and built, for Cargo.lock and mise.toml's Rust: a checkout's new times make cargo
      # build the workspace's own crates again whatever a cache holds, so only the dependencies are kept
      # (scripts/ci_cargo_prune.py), one entry per lock. Read by every run, written only by a push to main; host-windows
      # reads it too)
      - id: cache-restore
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-deps-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-deps-${{ steps.rust.outputs.version }}-
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked
      - name: The dependencies alone, for the cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-restore.outputs.cache-hit != 'true' }}
        run: python3 -I scripts/ci_cargo_prune.py
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-deps-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}

  # (the builder end to end on a synthetic game (builder/crates/synthetic-game): a made-up AArch64 program packed as a game,
  # lifted, compiled and linked by longshot-builder's stages, and run; no game data. clang and lld from the distribution:
  # an AArch64-capable clang assembles the synthetic program)
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: longshot-builder end to end (synthetic game)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # (main's tree from this runner's cache, so that checkout fetches only what the commit adds; anything amiss, and it
      # fetches all as before: scripts/ci_git_base.sh)
      - uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-base
          key: git-base
      - name: Seed the checkout
        env:
          BASE: ${{ runner.temp }}/git-base
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tip=$(git --git-dir="$BASE" rev-parse -q --verify 'refs/heads/base^{commit}' 2> /dev/null) || exit 0
          if git init -q . && git remote add origin "$ORIGIN" && cp "$BASE/shallow" .git/shallow &&
            echo "$BASE/objects" > .git/objects/info/alternates && git update-ref --no-deref HEAD "$tip"; then
            echo "main's ${tip:0:12} as the checkout's base"
          else
            rm -rf .git
          fi
      - name: Check out source
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The checkout's own objects
        run: scripts/ci_git_base.sh dissociate
      - name: main's tree for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/ci_git_base.sh save
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-base
          key: git-base
      # (the distribution's packages, with apt's lists and downloads kept per runner by the month, written only by a push
      # to main: scripts/ci_apt.sh)
      - name: The apt cache's key
        id: apt
        run: echo "key=apt-e2e-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: apt-cache
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-e2e-
      - name: clang and lld
        run: |
          if ! command -v clang > /dev/null || ! command -v ld.lld > /dev/null; then
            scripts/ci_apt.sh "$RUNNER_TEMP/apt" clang lld
          fi
          clang --version
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt
          key: ${{ steps.apt.outputs.key }}
      # (mise.toml's pinned Rust, through a checksum-pinned rustup: scripts/ci_rust.sh. ~/.rustup and cargo's bin/ are
      # kept per runner for that version, written only by a push to main: with them, ci_rust.sh finds the toolchain
      # installed and downloads nothing)
      - name: The Rust version
        id: rust
        run: echo "version=$(sed -n 's/^rust = { version = "\([0-9.]*\)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - id: rustup-cache
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-${{ steps.rust.outputs.version }}-e2e
      - name: Rust (mise.toml's)
        run: scripts/ci_rust.sh
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rustup-cache.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-${{ steps.rust.outputs.version }}-e2e
      # (the registry crates' release builds, as the rust job's cache: scripts/ci_cargo_prune.py)
      - id: cache-restore
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-e2e-deps-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-e2e-deps-${{ steps.rust.outputs.version }}-
      - name: The synthetic game, end to end
        env:
          LONGSHOT_E2E: '1'
        run: cargo test --locked --release -p synthetic-game -- --ignored --nocapture
      - name: The dependencies alone, for the cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-restore.outputs.cache-hit != 'true' }}
        run: python3 -I scripts/ci_cargo_prune.py
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-e2e-deps-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}

  # (the host's C as a player's Windows build compiles it, with llvm-mingw's Linux build of tools.lock's release: every
  # host unit build-compile plans, with its flags, compiled -fsyntax-only against a synthetic gen/rt (the lift's runtime
  # headers): the Windows branches of host code are compiled on every change, with no game and no Windows runner)
  host-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Host C for Windows (llvm-mingw, compile only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # (main's tree from this runner's cache, so that checkout fetches only what the commit adds; anything amiss, and it
      # fetches all as before: scripts/ci_git_base.sh)
      - uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-base
          key: git-base
      - name: Seed the checkout
        env:
          BASE: ${{ runner.temp }}/git-base
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tip=$(git --git-dir="$BASE" rev-parse -q --verify 'refs/heads/base^{commit}' 2> /dev/null) || exit 0
          if git init -q . && git remote add origin "$ORIGIN" && cp "$BASE/shallow" .git/shallow &&
            echo "$BASE/objects" > .git/objects/info/alternates && git update-ref --no-deref HEAD "$tip"; then
            echo "main's ${tip:0:12} as the checkout's base"
          else
            rm -rf .git
          fi
      - name: Check out source
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The checkout's own objects
        run: scripts/ci_git_base.sh dissociate
      - name: main's tree for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/ci_git_base.sh save
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-base
          key: git-base
      # (mise.toml's pinned Rust, through a checksum-pinned rustup: scripts/ci_rust.sh. ~/.rustup and cargo's bin/ are
      # kept per runner for that version, written only by a push to main: with them, ci_rust.sh finds the toolchain
      # installed and downloads nothing)
      - name: The Rust version
        id: rust
        run: echo "version=$(sed -n 's/^rust = { version = "\([0-9.]*\)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - id: rustup-cache
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-${{ steps.rust.outputs.version }}-host-windows
      - name: Rust (mise.toml's)
        run: scripts/ci_rust.sh
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rustup-cache.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-${{ steps.rust.outputs.version }}-host-windows
      - name: llvm-mingw version
        id: llvm
        run: echo "name=$(python3 -I scripts/longshot_builder.py llvm-mingw --name --host linux)" >> "$GITHUB_OUTPUT"
      # (the downloads only, llvm-mingw's archive and tools.lock's, each checked by its size and SHA-256 when taken: read by
      # every run, written only by a push to main, when missing)
      - id: llvm-cache
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm/.cache
          key: ${{ steps.llvm.outputs.name }}-archive
      - id: tools-cache
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tools-cache
          key: windows-tools-downloads-${{ hashFiles('tools.lock') }}
      # (the rust job's cache, read only: the builder below is built with most of the same registry crates)
      - uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-deps-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-deps-${{ steps.rust.outputs.version }}-
      - name: llvm-mingw
        run: echo "LONGSHOT_MINGW=$(python3 -I scripts/longshot_builder.py llvm-mingw "$RUNNER_TEMP/llvm" --host linux)" >> "$GITHUB_ENV"
      # (tools.lock's windows-x64 CPM cache, what a player's Windows build compiles with: the Vulkan, SPIR-V and VMA
      # headers, FFmpeg's and dav1d's)
      - name: tools.lock's cpm
        run: >-
          cargo run --locked -q -p longshot-builder --
          dev tools install "$RUNNER_TEMP/win-tools" --system windows-x64 --only cpm --cache "$RUNNER_TEMP/tools-cache"
      - name: The host's C, for Windows
        env:
          RX_TARGET: windows
          RX_MARCH: x86-64-v3
        run: >-
          RX_CPM="$RUNNER_TEMP/win-tools/tools/cpm" python3 -I scripts/check_host_compile.py
          --work "$RUNNER_TEMP/host-windows" --jobs "$(nproc)"
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.llvm-cache.outputs.cache-hit != 'true' }}
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm/.cache
          key: ${{ steps.llvm.outputs.name }}-archive
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tools-cache.outputs.cache-hit != 'true' }}
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tools-cache
          key: windows-tools-downloads-${{ hashFiles('tools.lock') }}

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: quick  # (a quick job: the runner kept free for these takes it, or any runner with room)
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (mise.toml's actionlint, the one pin: its release file and SHA-256 as mise.lock names them for linux-x64;
      # shellcheck from the runner image checks the run: scripts)
      - name: actionlint (mise.lock's)
        run: |
          read -r url sha < <(python3 -I -c 'import tomllib; t = tomllib.load(open("mise.lock", "rb"))["tools"]["github:rhysd/actionlint"][-1]["platforms.linux-x64"]; print(t["url"], t["checksum"].removeprefix("sha256:"))')
          curl -fsSL --retry 5 --retry-delay 10 --proto '=https' -o "$RUNNER_TEMP/actionlint.tar.gz" "$url"
          echo "$sha  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color -config-file .forgejo/actionlint.yaml .forgejo/workflows/*.yml'

  # (on every change, not only website/ ones: the site reads docs/ and the repository's files, so other changes can break
  # it. website.yml still builds, previews and deploys only when its sources change. No secrets here)
  website:
    name: Website build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # (main's tree from this runner's cache, so that checkout fetches only what the commit adds; anything amiss, and it
      # fetches all as before: scripts/ci_git_base.sh)
      - uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-base
          key: git-base
      - name: Seed the checkout
        env:
          BASE: ${{ runner.temp }}/git-base
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tip=$(git --git-dir="$BASE" rev-parse -q --verify 'refs/heads/base^{commit}' 2> /dev/null) || exit 0
          if git init -q . && git remote add origin "$ORIGIN" && cp "$BASE/shallow" .git/shallow &&
            echo "$BASE/objects" > .git/objects/info/alternates && git update-ref --no-deref HEAD "$tip"; then
            echo "main's ${tip:0:12} as the checkout's base"
          else
            rm -rf .git
          fi
      - name: Check out source
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The checkout's own objects
        run: scripts/ci_git_base.sh dissociate
      - name: main's tree for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/ci_git_base.sh save
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/git-base
          key: git-base
      - name: Build and check
        run: scripts/website_check.sh
