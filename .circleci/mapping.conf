# Path filtering (builder/: longshot-builder, which every build check runs; tests also turns on the rust, e2e and host-windows
# jobs, windows the host-windows one): last matching line wins for a parameter. full forces every area on: the Cargo
# workspace's manifest and lock (longshot-builder, longshot-rs, RenHDrum's crates) reach every build. longshot-rs/ is
# the game's Rust (the rust jobs), third_party/renhdrum/ the library both builders carry.
# lint, third-party, the guide checks and the website's checks always run; website turns on its preview (pull requests)
# and deploy (main); docs/ and .forgejo/ changes turn on no other area.
\.circleci/.* full true
mise\.toml full true
tools\.lock full true
mise\.lock full true
Cargo\.(toml|lock) full true
\.pre-commit-config\.yaml full true

tests/.* tests true
builder/.* tests true
longshot-rs/.* tests true
host/.* tests true
scripts/.* tests true
gpu/.* tests true
gpu/.* gpu true
third_party/imgui/.* gpu true
third_party/zstd/.* gpu true
builder/.* gpu true
scripts/fetch_commit\.sh gpu true

scripts/linux/.* linux true
host/posix/.* linux true
assets/.* linux true

scripts/tools\.py linux true
scripts/tools\.py windows true
builder/.* linux true
builder/.* windows true
scripts/longshot_builder\.py linux true
scripts/longshot_builder\.py windows true
scripts/renhdrum\.py linux true
scripts/renhdrum\.py windows true
third_party/renhdrum/.* linux true
third_party/renhdrum/.* windows true
scripts/check_host_compile\.py windows true

host/dav1d_av1\.c windows true
tests/test_dav1d_av1\.py windows true
tools\.lock windows true

website/.* website true
\.circleci/.* website true
