# Shared jobs and executors (merged with events/*.yml). magicbeandev/ci orb. Docs: docs/dev/reference/ci.md.
version: 2.1

orbs:
  # ORB_INLINE_START
  mb: magicbeandev/ci@0.1.2
  # ORB_INLINE_END

parameters:
  full: {type: boolean, default: false}
  nightly: {type: boolean, default: false}
  release_dry_run: {type: boolean, default: false}
  website_refresh: {type: boolean, default: false}
  vulkan_dlss: {type: boolean, default: false}
  fork_pr: {type: integer, default: 0}
  fork_sha: {type: string, default: ""}
  tests: {type: boolean, default: false}
  gpu: {type: boolean, default: false}
  linux: {type: boolean, default: false}
  windows: {type: boolean, default: false}
  website: {type: boolean, default: false}

executors:
  small:
    docker:
      - image: cimg/base:2026.10-24.04
    resource_class: arm.medium.gen2
  py312-large:
    docker:
      - image: cimg/python:3.12.7
    resource_class: large
  ubuntu2404-large:
    docker:
      - image: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    resource_class: large
  ubuntu2404:
    docker:
      - image: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
    resource_class: medium
  ubuntu22:
    docker:
      - image: ubuntu:22.04@sha256:74b12b11ffa550fba1929ad4d8d16533c34f6612728469671afba1b03b66881c
    resource_class: large
  node22:
    docker:
      - image: cimg/node:22.23.4
    resource_class: medium
  # Forgejo build-windows.yml: ubuntu-24.04 VM (Wine, sudo, no container quirks).
  ubuntu2404-vm:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium

commands:
  release-checked-skip:
    parameters:
      prefix:
        type: string
        default: ""
    steps:
      - run:
          name: Skip when already released
          command: |
            set -euo pipefail
            . release.env
            tag="${TAG:-}"
            checked="${CHECKED:-}"
            prefix="<< parameters.prefix >>"
            [ -z "$checked" ] && exit 1
            [ -z "$tag" ] && exit 1
            case "$tag" in
              nightly-*)
                if [[ "$checked" == nightly-* ]]; then
                  echo "${prefix}skip: already ${checked}"
                  circleci-agent step halt
                fi ;;
              v*)
                if [[ "$checked" == v* ]]; then
                  echo "${prefix}skip: already ${checked}"
                  circleci-agent step halt
                fi ;;
            esac
  test-deps-linux:
    steps:
      - run:
          name: Base packages (git, curl, python before fetch_commit)
          command: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl git python3 python3-pip \
              g++ clang lld spirv-tools ccache libdav1d-dev
      - run:
          name: Pinned SPIR-V and Vulkan headers (.forgejo/workflows/ci.yml)
          command: |
            set -euo pipefail
            scripts/fetch_commit.sh https://github.com/KhronosGroup/SPIRV-Headers \
              04f10f650d514df88b76d25e83db360142c7b174 _deps/spirv-headers
            scripts/fetch_commit.sh https://github.com/KhronosGroup/Vulkan-Headers \
              74d8a6cb930c68ef617b202c3ff3c59d919e086b _deps/vulkan-headers
      - run:
          name: Python packages for the tests (Forgejo ci.yml)
          command: |
            set -euo pipefail
            python3 -m pip install --disable-pip-version-check --break-system-packages --no-deps \
              zstandard==0.25.0 pillow==13.0.0 numpy==2.5.4 unicorn==2.1.4
      - run:
          name: Pinned glslang 16.6.0 (x86_64 release tarball)
          command: |
            set -euo pipefail
            tool_dir="$HOME/glslang-16.6.0"
            mkdir -p "$tool_dir"
            curl -fL --retry 3 -o "$tool_dir/glslang.tar.gz" \
              https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz
            echo '2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce  '"$tool_dir/glslang.tar.gz" | sha256sum -c --strict
            tar -xzf "$tool_dir/glslang.tar.gz" -C "$tool_dir"
            "$tool_dir/bin/glslangValidator" --version | head -1
      - run:
          name: Compiler cache and test environment
          command: |
            set -euo pipefail
            mkdir -p "$HOME/ccache" "$HOME/ccache-bin"
            for c in cc c++ gcc g++ clang clang++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$c"; done
            {
              echo "export LONGSHOT_SPIRV_HEADERS=$PWD/_deps/spirv-headers/include"
              echo "export LONGSHOT_VULKAN_HEADERS=$PWD/_deps/vulkan-headers/include"
              echo "export PATH=\"$HOME/glslang-16.6.0/bin:$HOME/ccache-bin:\$PATH\""
              echo 'export CCACHE_DIR=$HOME/ccache CCACHE_MAXSIZE=400M'
            } >> "$BASH_ENV"
            if ! command -v circleci >/dev/null; then
              if [ -n "${CIRCLECI:-}" ] && [ "${CIRCLECI_LOCAL_HARNESS:-}" != "1" ]; then
                echo "circleci CLI should be injected by the CircleCI agent in docker jobs"
                exit 1
              fi
              cli_ver=1.14.0
              curl -fsSL "https://github.com/CircleCI-Public/circleci-cli/releases/download/v${cli_ver}/circleci-cli_${cli_ver}_linux_amd64.tar.gz" \
                -o /tmp/circleci-cli.tgz
              echo '5d0227b38ad65b2fb23ef1fbebfe98851c77102f76a72df2273eacca941665c4  /tmp/circleci-cli.tgz' | sha256sum -c -
              tar -xzf /tmp/circleci-cli.tgz -C /tmp circleci
              install -m0755 /tmp/circleci /usr/local/bin/circleci
            fi
            circleci version
  linux-builder-packages:
    steps:
      - run:
          name: Package installs without fsync
          command: echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/force-unsafe-io
      # (git for the version, curl and xz for the downloads, zstd for the pack and the deltas (1.4.8: --patch-from),
      # Python for the scripts, gcc for the links: RenHDrum's and longshot-builder's against this glibc, 2.35)
      - run:
          name: System packages (build-linux.yml)
          environment:
            DEBIAN_FRONTEND: noninteractive
          command: |
            set -euo pipefail
            for try in 1 2 3; do
              apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl xz-utils zstd python3 \
                build-essential && break
              [ "$try" = 3 ] && exit 1
              sleep 20
            done
  llvm-mingw:
    parameters:
      release: # (a release's build: no cache restored or saved, the archive downloaded and checked)
        type: boolean
        default: false
    steps:
      # (only the archive is kept (~/llvm/.cache), checked by its size and SHA-256 each time it is taken, and unpacked on
      # every run: never an unpacked folder, which nothing checks again)
      - run:
          name: llvm-mingw's name
          command: python3 -I scripts/longshot_builder.py llvm-mingw --name --host linux | tee /tmp/llvm-mingw-name
      - unless:
          condition: << parameters.release >>
          steps:
            - restore_cache:
                keys:
                  - v2-llvm-mingw-archive-{{ checksum "/tmp/llvm-mingw-name" }}
      - run:
          name: llvm-mingw (tools.lock, linux host)
          command: |
            set -euo pipefail
            echo "export LLVM_MINGW=\"$(python3 -I scripts/longshot_builder.py llvm-mingw "$HOME/llvm" --host linux)\"" >> "$BASH_ENV"
            echo 'export PATH="$LLVM_MINGW/bin:$PATH"' >> "$BASH_ENV"
      - unless:
          condition: << parameters.release >>
          steps:
            - mb/save-cache-main:
                fork-pr: << pipeline.parameters.fork_pr >>
                git-branch: << pipeline.git.branch >>
                key: v2-llvm-mingw-archive-{{ checksum "/tmp/llvm-mingw-name" }}
                paths: ~/llvm/.cache
  longshot-builder:
    # (builder/'s longshot-builder with scripts/renhdrum.py's pinned Rust and Cargo.lock's crates, each checked by its
    # SHA-256, as build-linux.yml and build-windows.yml build it; the downloads cached, never the build)
    parameters:
      target: {type: enum, enum: [linux, windows], default: linux}
      profile: {type: enum, enum: [dist, release], default: release}
      out: {type: string}
      sources: {type: string, default: ""}   # (the pack it carries (longshot-builder dev release sources): a release's)
      release: {type: boolean, default: false}   # (a release's build: no cache restored or saved)
    steps:
      - unless:
          condition: << parameters.release >>
          steps:
            - restore_cache:
                keys:
                  - v1-longshot-builder-rust-<< parameters.target >>-{{ checksum "scripts/renhdrum.py" }}-{{ checksum "Cargo.lock" }}
      - run:
          name: longshot-builder (<< parameters.target >>, << parameters.profile >>)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            mkdir -p "$HOME/longshot-builder-rust/crates"
            if [ -d "$HOME/longshot-builder-rust-cache" ]; then   # (the restored downloads only, checked by their SHA-256 when used)
              cp -n "$HOME"/longshot-builder-rust-cache/*.tar.xz "$HOME/longshot-builder-rust/" 2>/dev/null || true
              cp -n "$HOME"/longshot-builder-rust-cache/crates/*.crate "$HOME/longshot-builder-rust/crates/" 2>/dev/null || true
            fi
            args=(--target << parameters.target >> --profile << parameters.profile >> --cache "$HOME/longshot-builder-rust"
                  --out "<< parameters.out >>" --jobs "$(nproc)")
            if [ "<< parameters.target >>" = windows ]; then args+=(--llvm-mingw "$LLVM_MINGW"); fi
            if [ -n "<< parameters.sources >>" ]; then args+=(--sources "<< parameters.sources >>"); fi
            python3 -I scripts/longshot_builder.py build "${args[@]}"
      - unless:
          condition: << parameters.release >>
          steps:
            - run:
                name: The pinned Rust's downloads alone, for the cache
                command: |
                  mkdir -p "$HOME/longshot-builder-rust-cache"
                  cp -al "$HOME"/longshot-builder-rust/*.tar.xz "$HOME/longshot-builder-rust/crates" \
                    "$HOME/longshot-builder-rust-cache/" 2>/dev/null || true
            - mb/save-cache-main:
                fork-pr: << pipeline.parameters.fork_pr >>
                git-branch: << pipeline.git.branch >>
                key: v1-longshot-builder-rust-<< parameters.target >>-{{ checksum "scripts/renhdrum.py" }}-{{ checksum "Cargo.lock" }}
                paths: ~/longshot-builder-rust-cache
  rustup:
    parameters:
      components: {type: string, default: ""}
    steps:
      # (mise.toml's pinned Rust, through a checksum-pinned rustup: scripts/ci_rust.sh, as Forgejo's ci.yml)
      - run:
          name: Rust (mise.toml's)
          command: scripts/ci_rust.sh "<< parameters.components >>"
  fetch-release-history:
    steps:
      - run:
          name: Unshallow with tags
          command: |
            set -euo pipefail
            git fetch -q --filter=blob:none --unshallow origin 2>/dev/null || true
            git fetch -q --tags origin main
  main-release-py:
    steps:
      - run:
          name: Tooling's release.py, at the commit main's .tooling-rev names
          command: |
            set -euo pipefail
            git fetch -q origin main
            # (main's pin, so a branch cannot change the release for itself; the branch's own until main has one)
            rev=$(git show origin/main:.tooling-rev 2>/dev/null || cat .tooling-rev)
            git clone -q https://git.magicbean.dev/MagicBeanDev/Tooling.git .mb-tooling
            git -C .mb-tooling checkout -q --detach "$rev"
            echo 'export MAIN_RELEASE_PY="$PWD/.mb-tooling/scripts/release.py"' >> "$BASH_ENV"
  website-pr-sources:
    steps:
      - run:
          name: Main lockfiles; PR website/ only (no symlinks)
          command: |
            set -euo pipefail
            test -d website || exit 0
            if ! command -v rsync >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends rsync
            fi
            git fetch -q origin main
            pr_ref=$(git rev-parse HEAD)
            git archive origin/main website/package.json website/package-lock.json website/wrangler.jsonc | tar -x
            git archive "$pr_ref" website | tar -x -C /tmp
            rsync -a --delete --no-links \
              --exclude package.json --exclude package-lock.json --exclude wrangler.jsonc \
              /tmp/website/ website/
jobs:
  lint:
    executor: small
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - mb/setup-mise:
          fork-pr: << pipeline.parameters.fork_pr >>
          git-branch: << pipeline.git.branch >>
      - run:
          name: pre-commit
          command: |
            set -euo pipefail
            BASE="$(git merge-base HEAD origin/main)"
            # on main the merge-base is HEAD itself: check the pushed commit only
            if [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE="$(git rev-parse HEAD~1)"; fi
            mise exec -- pre-commit run --from-ref "$BASE" --to-ref HEAD --show-diff-on-failure
      - run:
          name: actionlint (.forgejo workflows)
          command: mise exec -- actionlint -color -config-file .forgejo/actionlint.yaml .forgejo/workflows/*.yml
      - run:
          name: shellcheck (repository shell scripts)
          command: |
            set -euo pipefail
            mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0)
            if [ ${#files[@]} -gt 0 ]; then mise exec -- shellcheck -S error "${files[@]}"; fi
      - mb/commit-subjects
      - mb/policy-check:
          forks: .circleci/forks.yml

  third-party:
    executor: small
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - run:
          name: scripts/check_third_party.py
          command: |
            set -euo pipefail
            python3 -I scripts/check_third_party.py
            if [ "<< pipeline.parameters.fork_pr >>" -gt 0 ]; then
              git fetch -q origin main
              base=$(git merge-base HEAD origin/main)
              python3 -I scripts/check_third_party.py --base "$base"
            elif [ "${CIRCLE_BRANCH:-}" != main ] && [ -n "${CIRCLE_BRANCH:-}" ]; then
              git fetch -q origin main
              python3 -I scripts/check_third_party.py --base FETCH_HEAD
            fi

  third-party-upstream:
    executor: small
    steps:
      - checkout
      - run:
          name: Upstream comparison (nightly)
          no_output_timeout: 20m
          command: python3 -I scripts/check_third_party.py --upstream

  guide-screenshots:
    executor: small
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - run:
          name: Integrity and local UI drift (guide-screenshots.yml)
          command: python3 -I -B scripts/check_guide_screenshots.py --review-sources
      - run:
          name: Checker regression tests
          command: python3 -I -B tests/test_guide_screenshots.py
      - run:
          name: Capture isolation and build-policy regression tests
          command: python3 -I -B tests/test_launcher_capture.py

  test-linux:
    executor: ubuntu2404-large
    parallelism: 4
    retention:
      caches: 5d
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - test-deps-linux
      - restore_cache:
          keys:
            - v2-pip-{{ checksum ".circleci/shared.yml" }}
      - restore_cache:
          keys:
            - v2-ccache-{{ arch }}-{{ .Revision }}
            - v2-ccache-{{ arch }}-
      - mb/save-cache-main:
          fork-pr: << pipeline.parameters.fork_pr >>
          git-branch: << pipeline.git.branch >>
          key: v2-pip-{{ checksum ".circleci/shared.yml" }}
          paths: ~/.cache/pip
      - run:
          name: Game-free checks (Smarter Testing, static split)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            mkdir -p test-results/run_all
            circleci testsuite run "game-free checks"
      - store_test_results:
          path: test-results/run_all
          when: always
      - mb/save-cache-main:
          fork-pr: << pipeline.parameters.fork_pr >>
          git-branch: << pipeline.git.branch >>
          key: v2-ccache-{{ arch }}-{{ .Revision }}
          paths: ~/ccache

  fork-test-linux:
    executor: ubuntu2404-large
    parallelism: 2
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - test-deps-linux
      - restore_cache:
          keys:
            - v2-pip-{{ checksum ".circleci/shared.yml" }}
      - restore_cache:
          keys:
            - v2-ccache-{{ arch }}-
      - run:
          name: Game-free checks (fork, Smarter Testing)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            mkdir -p test-results/run_all
            circleci testsuite run "game-free checks"
      - store_test_results:
          path: test-results/run_all
          when: always

  rust:
    # (.forgejo/workflows/ci.yml rust: rustfmt's check, clippy with warnings as errors, cargo test. Its tests compile and
    # link with clang and ld.lld (build-compile's compile_link) and disassemble with llvm-mc (a64's llvm_mc), and fail
    # without them: the distribution's clang, lld and llvm, LLVM_MC naming llvm-mc. Never LONGSHOT_NO_CLANG here)
    executor: ubuntu2404-large
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - run:
          name: Base packages, clang, lld and llvm-mc
          command: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl git build-essential python3 clang lld llvm
            mc=$(command -v llvm-mc || find /usr/lib -path '/usr/lib/llvm-*/bin/llvm-mc' 2>/dev/null | sort -V | tail -1)
            if [ -z "$mc" ] || ! "$mc" --version > /dev/null; then echo "no llvm-mc"; exit 1; fi
            clang --version && ld.lld --version
            echo "export LLVM_MC=$mc" >> "$BASH_ENV"
      - rustup:
          components: rustfmt,clippy
      - restore_cache:
          keys:
            - v1-rust-{{ checksum "Cargo.lock" }}-{{ .Revision }}
            - v1-rust-{{ checksum "Cargo.lock" }}-
      - run:
          name: rustfmt
          command: cargo fmt --all --check
      - run:
          name: clippy
          no_output_timeout: 20m
          command: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run:
          name: cargo test
          no_output_timeout: 30m
          command: cargo test --workspace --locked
      - mb/save-cache-main:
          fork-pr: << pipeline.parameters.fork_pr >>
          git-branch: << pipeline.git.branch >>
          key: v1-rust-{{ checksum "Cargo.lock" }}-{{ .Revision }}
          paths: target

  e2e:
    # (.forgejo/workflows/ci.yml e2e: the builder end to end on a synthetic game (builder/crates/synthetic-game): a made-up
    # AArch64 program packed as a game, lifted, compiled and linked by longshot-builder's stages, and run; no game data.
    # clang and lld from the distribution: an AArch64-capable clang assembles the synthetic program)
    executor: ubuntu2404
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - run:
          name: Base packages, clang and lld
          command: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl git build-essential python3
            if ! command -v clang > /dev/null || ! command -v ld.lld > /dev/null; then
              apt-get install -y --no-install-recommends clang lld
            fi
            clang --version
      - rustup
      # (Cargo.lock's crates and target/, kept apart: mb/save-cache-main takes one path)
      - restore_cache:
          keys:
            - v1-cargo-registry-e2e-{{ checksum "Cargo.lock" }}
      - restore_cache:
          keys:
            - v1-rust-e2e-{{ checksum "Cargo.lock" }}-{{ .Revision }}
            - v1-rust-e2e-{{ checksum "Cargo.lock" }}-
      - run:
          name: The synthetic game, end to end
          no_output_timeout: 20m
          environment:
            LONGSHOT_E2E: "1"
          command: cargo test --locked --release -p synthetic-game -- --ignored --nocapture
      - mb/save-cache-main:
          fork-pr: << pipeline.parameters.fork_pr >>
          git-branch: << pipeline.git.branch >>
          key: v1-cargo-registry-e2e-{{ checksum "Cargo.lock" }}
          paths: ~/.cargo/registry
      - mb/save-cache-main:
          fork-pr: << pipeline.parameters.fork_pr >>
          git-branch: << pipeline.git.branch >>
          key: v1-rust-e2e-{{ checksum "Cargo.lock" }}-{{ .Revision }}
          paths: target

  host-windows:
    # (.forgejo/workflows/ci.yml host-windows: every host unit build-compile plans for a Windows game, compiled
    # -fsyntax-only with llvm-mingw against a synthetic gen/rt: scripts/check_host_compile.py)
    executor: py312-large
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - llvm-mingw
      - rustup
      - run:
          name: tools.lock's cpm (the headers, FFmpeg and dav1d a player's Windows build compiles with)
          command: >-
            cargo run --locked -q -p longshot-builder --
            dev tools install /tmp/win-tools --system windows-x64 --only cpm --cache /tmp/tools-cache
      - run:
          name: The host's C, for Windows
          no_output_timeout: 20m
          environment:
            RX_TARGET: windows
            RX_MARCH: x86-64-v3
          command: |
            set -euo pipefail
            LONGSHOT_MINGW="$LLVM_MINGW" RX_CPM=/tmp/win-tools/tools/cpm \
              python3 -I scripts/check_host_compile.py --work /tmp/host-windows --jobs "$(nproc)"

  spirv-fixtures:
    executor: ubuntu2404
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - run:
          name: SPIR-V headers and toolchain (.forgejo/workflows/ci.yml spirv-fixtures)
          command: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl clang spirv-tools ccache cmake make git
            scripts/fetch_commit.sh https://github.com/KhronosGroup/SPIRV-Headers \
              496543121ce6419f23d6fa5d7194ba66c36212d2 _deps/spirv-headers
            export CCACHE_DIR=/tmp/ccache CCACHE_MAXSIZE=400M CMAKE_CXX_COMPILER_LAUNCHER=ccache
            mkdir -p "$CCACHE_DIR"
      - run:
          name: SPIR-V fixtures (global_load_16, native_suatom, f2i_immediate)
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            root="$PWD"
            hdr="$root/_deps/spirv-headers"
            fix=/tmp/spirv-fixtures
            nproc="$(nproc)"
            CC=clang CXX=clang++ cmake -S tests/global_load_16 -B "$fix/global-load-16" \
              -DREPO_ROOT="$root" -DSPIRV_HEADERS_ROOT="$hdr"
            cmake --build "$fix/global-load-16" --parallel "$nproc"
            "$fix/global-load-16/global_load_16_ir" "$fix/global-load-16/modules"
            RX_VK_FOLLOW_STORES=1 "$fix/global-load-16/global_load_16_ir" --cas-loops "$fix/global-load-16/modules"
            for module in "$fix/global-load-16/modules"/*.spv; do
              spirv-val --target-env vulkan1.3 --uniform-buffer-standard-layout "$module"
            done
            CC=clang CXX=clang++ cmake -S tests/native_suatom -B "$fix/native-suatom" \
              -DREPO_ROOT="$root" -DSPIRV_HEADERS_ROOT="$hdr"
            cmake --build "$fix/native-suatom" --parallel "$nproc"
            "$fix/native-suatom/native_suatom" "$fix/native-suatom/modules"
            for module in "$fix/native-suatom/modules"/*.spv; do
              spirv-val --target-env vulkan1.3 "$module"
            done
            CC=clang CXX=clang++ cmake -S tests/f2i_immediate -B "$fix/f2i" \
              -DREPO_ROOT="$root" -DSPIRV_HEADERS_ROOT="$hdr"
            cmake --build "$fix/f2i" --parallel "$nproc"
            "$fix/f2i/f2i_immediate" "$fix/f2i/modules"
            for module in "$fix/f2i/modules"/*.spv; do
              spirv-val --target-env vulkan1.3 --uniform-buffer-standard-layout "$module"
            done
            ccache --show-stats

  linux-longshot-builder:
    # (.forgejo/workflows/build-linux.yml linux: longshot-builder-<version>-linux-x64, one program (glibc 2.35, the dist
    # profile) that carries the sources, the release's third-party objects, renhdrum.so and tools.lock's linux-x64 bundle,
    # built in Ubuntu 22.04, the oldest system the game it builds is for (glibc 2.35). release: true is the release's
    # (release.env's version and channel: the deltas from the channel's last releases and the manifest, the files persisted
    # for release-stage; a commit released already skips only the back end's build checks, which ship nothing); otherwise
    # git describe's version, on no channel, which makes no deltas)
    parameters:
      release: {type: boolean, default: false}
    executor: ubuntu22
    environment:
      DEBIAN_FRONTEND: noninteractive
    retention:
      caches: 5d
    steps:
      - linux-builder-packages
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - run:
          name: Trust checkout
          command: git config --global --add safe.directory "$PWD"
      - when:
          condition: << parameters.release >>
          steps:
            - attach_workspace:
                at: .
            - run:
                name: Skip when no tag
                command: |
                  . release.env
                  if [ -z "${TAG:-}" ]; then circleci-agent step halt; fi
      - run:
          name: Version (build-linux.yml)
          command: |
            set -euo pipefail
            # (a release's tag, from release.env, or git describe --long's for another run, which is on no channel:
            # longshot-builder dev release files makes no deltas for it)
            release_tag=""
            if [ "<< parameters.release >>" = true ]; then release_tag=$(. ./release.env && echo "${TAG:-}"); fi
            tag=${release_tag:-$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0-0-g$(git rev-parse --short HEAD)")}
            echo "export TAG=$tag" >> "$BASH_ENV"
            echo "$tag"
      # (a longshot-builder that carries nothing, the release profile: it installs the build tools below (it needs none of
      # them to be built), makes the third-party objects from the checkout (--root), and builds the back end's checks)
      - longshot-builder:
          target: linux
          release: << parameters.release >>
          profile: release
          out: /tmp/host/longshot-builder
      # (tools.lock's linux-x64 bundle, at tools/<name>/ of the checkout (`longshot-builder dev tools install`), where
      # longshot-builder --root <checkout> takes them (build-driver's tools); the downloads kept for every run, a release's
      # too: the builder checks a kept archive's size and SHA-256 each time it takes one)
      - unless:
          condition: << parameters.release >>
          steps:
            - restore_cache:
                keys:
                  - v1-linux-tools-downloads-{{ checksum "tools.lock" }}
      - run:
          name: The build tools (tools.lock, linux-x64)
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            /tmp/host/longshot-builder dev tools install "$PWD" --system linux-x64 --cache "$HOME/tools-cache"
            echo "export BUNDLE=\"$PWD\"" >> "$BASH_ENV"
      - unless:
          condition: << parameters.release >>
          steps:
            - mb/save-cache-main:
                fork-pr: << pipeline.parameters.fork_pr >>
                git-branch: << pipeline.git.branch >>
                key: v1-linux-tools-downloads-{{ checksum "tools.lock" }}
                paths: ~/tools-cache
      - run:
          name: The third-party objects (longshot-builder compile --third-party-objects)
          no_output_timeout: 30m
          command: >-
            /tmp/host/longshot-builder compile --work /tmp/third-party-work --root "$PWD"
            --store /tmp/third-party-work/store --jobs "$(nproc)" --third-party-objects /tmp/third_party_objects
      # (renhdrum.so from third_party/renhdrum with scripts/renhdrum.py's pinned Rust, linked here against glibc 2.35)
      # (only the downloads are kept, each checked by its SHA-256 when taken: never an unpacked Rust, which nothing
      # checks again)
      - unless:
          condition: << parameters.release >>
          steps:
            - restore_cache:
                keys:
                  - v2-renhdrum-rust-linux-{{ checksum "scripts/renhdrum.py" }}-{{ checksum "third_party/renhdrum/Cargo.lock" }}
      - run:
          name: renhdrum.so
          no_output_timeout: 20m
          command: |
            mkdir -p "$HOME/renhdrum-rust"
            mkdir -p "$HOME/renhdrum-rust/crates"
            if [ -d "$HOME/renhdrum-rust-cache" ]; then   # (the restored downloads only, checked by their SHA-256 when used)
              cp -n "$HOME"/renhdrum-rust-cache/*.tar.xz "$HOME/renhdrum-rust/" 2>/dev/null || true
              cp -n "$HOME"/renhdrum-rust-cache/crates/*.crate "$HOME/renhdrum-rust/crates/" 2>/dev/null || true
            fi
            python3 -I scripts/renhdrum.py build --target linux --linker gcc --cache "$HOME/renhdrum-rust" --out /tmp/renhdrum/renhdrum.so
            mkdir -p "$HOME/renhdrum-rust-cache"
            cp -al "$HOME"/renhdrum-rust/*.tar.xz "$HOME/renhdrum-rust/crates" "$HOME/renhdrum-rust-cache/" 2>/dev/null || true
      - unless:
          condition: << parameters.release >>
          steps:
            - mb/save-cache-main:
                fork-pr: << pipeline.parameters.fork_pr >>
                git-branch: << pipeline.git.branch >>
                key: v2-renhdrum-rust-linux-{{ checksum "scripts/renhdrum.py" }}-{{ checksum "third_party/renhdrum/Cargo.lock" }}
                paths: ~/renhdrum-rust-cache
      # (what the program carries, each part a zstd member of its own (longshot-builder dev release sources); then the
      # program, static, the dist profile, with it inside)
      - run:
          name: What longshot-builder-<version>-linux-x64 carries
          command: |
            set -euo pipefail
            /tmp/host/longshot-builder dev release sources --out /tmp/sources.pack --version "$TAG" \
              --third-party-objects /tmp/third_party_objects \
              --add "third_party/renhdrum/renhdrum.so=/tmp/renhdrum/renhdrum.so" --tools "$BUNDLE/tools"
            mkdir -p dist
      - longshot-builder:
          target: linux
          release: << parameters.release >>
          profile: dist
          sources: /tmp/sources.pack
          out: dist/longshot-builder-$TAG-linux-x64
      # (a player's build from the program itself, with no game and nothing beside it, up to where the lifted game is
      # needed: what it carries unpacked into an empty cache, then its compile's dry run with and without AMD FSR 4: a
      # file the program does not carry, or a third-party object a player's build would compile, fails here)
      - run:
          name: A player's build from the program
          no_output_timeout: 20m
          command: >-
            /tmp/host/longshot-builder dev release dry-run "dist/longshot-builder-$TAG-linux-x64" --clean
            --cache /tmp/player-cache --work /tmp/dry
      - when:
          condition: << parameters.release >>
          steps:
            # (the deltas from the channel's last releases to this one, and the release's manifest for linux-x64)
            # (the release's stamps, the deltas from its channel's last releases and its manifest for linux-x64)
            - run:
                name: The deltas and the manifest
                no_output_timeout: 30m
                command: >-
                  /tmp/host/longshot-builder dev release files "dist/longshot-builder-$TAG-linux-x64" --version "$TAG"
                  --platform linux-x64 --work /tmp/release
            - persist_to_workspace:
                root: .
                paths:
                  - dist/longshot-builder-*-linux-x64*
            # (a commit released already passed the build checks below in its run: they ship nothing, so they stop here)
            - release-checked-skip
      # The Vulkan back end's object store (longshot-builder's, build-linux/vk-store: each object under the key of its
      # compiler, flags, source and the headers it read): a build check compiles only the files a change reaches
      - unless:
          condition: << parameters.release >>
          steps:
            - restore_cache:
                keys:
                  - v1-linux-vk-store-{{ checksum "tools.lock" }}-{{ .Revision }}
                  - v1-linux-vk-store-{{ checksum "tools.lock" }}-
      # (the back end alone (compile --only renderer: no lift, no game), as a player's build compiles it, without and with
      # AMD FSR 4. RX_MARCH=x86-64-v3, not this machine's own CPU, so the store's keys stay the same between machines)
      - run:
          name: longshot_vk.so (build check)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            rm -rf build-linux/vk-work
            RX_MARCH=x86-64-v3 RX_RELEASE=1 /tmp/host/longshot-builder compile --only renderer \
              --work build-linux/vk-work --root "$PWD" --store build-linux/vk-store --jobs "$(nproc)"
            test -f build-linux/vk-work/build/longshot_vk.so
      - run:
          name: longshot_vk.so with AMD FSR 4 (build check)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            rm -rf /tmp/vk-fsr
            RX_MARCH=x86-64-v3 RX_RELEASE=1 /tmp/host/longshot-builder compile --only renderer \
              --work /tmp/vk-fsr --root "$PWD" --store build-linux/vk-store --jobs "$(nproc)" --upscaler fsr4 |
              tee /tmp/vk-fsr.log
            test "${PIPESTATUS[0]}" -eq 0
            grep -q "with AMD FSR 4" /tmp/vk-fsr.log
            test -f /tmp/vk-fsr/build/longshot_vk.so
      - unless:
          condition: << parameters.release >>
          steps:
            - mb/save-cache-main:
                fork-pr: << pipeline.parameters.fork_pr >>
                git-branch: << pipeline.git.branch >>
                key: v1-linux-vk-store-{{ checksum "tools.lock" }}-{{ .Revision }}
                paths: build-linux/vk-store

  windows-longshot-builder:
    # (.forgejo/workflows/build-windows.yml package: longshot-builder-<version>-windows-x64.exe, one program
    # (x86_64-pc-windows-gnullvm, the dist profile, with llvm-mingw) that carries the sources, the release's third-party
    # objects, renhdrum.dll and tools.lock's windows-x64 bundle; cross-compiled on Linux, started under Wine. release: true
    # is the release's (release.env's version and channel: the deltas and the manifest, the files persisted for
    # release-stage; llvm-mingw from its checked download, no unpacked folder from a cache); otherwise git describe's
    # version, on no channel)
    parameters:
      release: {type: boolean, default: false}
    executor: ubuntu2404-vm
    retention:
      caches: 5d
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - when:
          condition: << parameters.release >>
          steps:
            - attach_workspace:
                at: .
            - run:
                name: Skip when no tag
                command: |
                  . release.env
                  if [ -z "${TAG:-}" ]; then circleci-agent step halt; fi
      - run:
          name: Python 3 and zstd (build-windows.yml)
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3 ca-certificates curl zstd
      # (Wine starts the program and the dav1d test)
      - run:
          name: Wine
          command: |
            set -euo pipefail
            sudo apt-get install -y --no-install-recommends wine64 xvfb xauth zstd
      - llvm-mingw:
          release: << parameters.release >>
      - run:
          name: Version (build-windows.yml)
          command: |
            set -euo pipefail
            # (a release's tag, from release.env, or git describe --long's for another run, which is on no channel:
            # longshot-builder dev release files makes no deltas for it)
            release_tag=""
            if [ "<< parameters.release >>" = true ]; then release_tag=$(. ./release.env && echo "${TAG:-}"); fi
            tag=${release_tag:-$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0-0-g$(git rev-parse --short HEAD)")}
            echo "export TAG=$tag" >> "$BASH_ENV"
            echo "$tag"
      # (a Linux longshot-builder that carries nothing, this machine's: the build tools below (it needs none of them to be
      # built), the third-party objects and the dry run)
      - longshot-builder:
          target: linux
          release: << parameters.release >>
          profile: release
          out: /tmp/host/longshot-builder
      # (tools.lock's windows-x64 bundle, at tools/<name>/ of the checkout (`longshot-builder dev tools install`), where
      # longshot-builder --root <checkout> takes them (build-driver's tools), each archive checked by its size and SHA-256;
      # the downloads kept for every run)
      - unless:
          condition: << parameters.release >>
          steps:
            - restore_cache:
                keys:
                  - v1-windows-tools-downloads-{{ checksum "tools.lock" }}
      - run:
          name: The build tools (tools.lock, windows-x64)
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            /tmp/host/longshot-builder dev tools install "$PWD" --system windows-x64 --cache "$HOME/tools-cache"
            echo "export BUNDLE=\"$PWD\"" >> "$BASH_ENV"
      - unless:
          condition: << parameters.release >>
          steps:
            - mb/save-cache-main:
                fork-pr: << pipeline.parameters.fork_pr >>
                git-branch: << pipeline.git.branch >>
                key: v1-windows-tools-downloads-{{ checksum "tools.lock" }}
                paths: ~/tools-cache
      # (the third-party code's objects a player's build takes instead of compiling them: made with the bundle's
      # llvm-mingw and CPM cache, what a player's build compiles them with)
      - run:
          name: The third-party objects (longshot-builder compile --third-party-objects)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            RX_TARGET=windows LONGSHOT_MINGW="$LLVM_MINGW" \
              /tmp/host/longshot-builder compile --work /tmp/third-party-work \
              --store /tmp/third-party-work/store --root "$PWD" --jobs "$(nproc)" \
              --third-party-objects /tmp/third_party_objects
      # (renhdrum.dll, the DualSense haptics' back end, from third_party/renhdrum with the pinned Rust and the llvm-mingw
      # above. --target windows: this machine is Linux)
      # (only the downloads are kept, each checked by its SHA-256 when taken: never an unpacked Rust, which nothing
      # checks again)
      - unless:
          condition: << parameters.release >>
          steps:
            - restore_cache:
                keys:
                  - v2-renhdrum-rust-windows-{{ checksum "scripts/renhdrum.py" }}-{{ checksum "third_party/renhdrum/Cargo.lock" }}
      - run:
          name: renhdrum.dll
          no_output_timeout: 20m
          command: |
            mkdir -p "$HOME/renhdrum-rust"
            mkdir -p "$HOME/renhdrum-rust/crates"
            if [ -d "$HOME/renhdrum-rust-cache" ]; then   # (the restored downloads only, checked by their SHA-256 when used)
              cp -n "$HOME"/renhdrum-rust-cache/*.tar.xz "$HOME/renhdrum-rust/" 2>/dev/null || true
              cp -n "$HOME"/renhdrum-rust-cache/crates/*.crate "$HOME/renhdrum-rust/crates/" 2>/dev/null || true
            fi
            python3 -I scripts/renhdrum.py build --target windows --llvm-mingw "$LLVM_MINGW" --cache "$HOME/renhdrum-rust" --out /tmp/renhdrum/renhdrum.dll
            mkdir -p "$HOME/renhdrum-rust-cache"
            cp -al "$HOME"/renhdrum-rust/*.tar.xz "$HOME/renhdrum-rust/crates" "$HOME/renhdrum-rust-cache/" 2>/dev/null || true
      - unless:
          condition: << parameters.release >>
          steps:
            - mb/save-cache-main:
                fork-pr: << pipeline.parameters.fork_pr >>
                git-branch: << pipeline.git.branch >>
                key: v2-renhdrum-rust-windows-{{ checksum "scripts/renhdrum.py" }}-{{ checksum "third_party/renhdrum/Cargo.lock" }}
                paths: ~/renhdrum-rust-cache
      # (what the program carries, each part a zstd member of its own (longshot-builder dev release sources), then the
      # program, the dist profile, with it inside; checked: x86-64, Windows' own DLLs only)
      - run:
          name: What longshot-builder-<version>-windows-x64.exe carries
          command: |
            set -euo pipefail
            /tmp/host/longshot-builder dev release sources --out /tmp/sources.pack --version "$TAG" \
              --third-party-objects /tmp/third_party_objects \
              --add "third_party/renhdrum/renhdrum.dll=/tmp/renhdrum/renhdrum.dll" --tools "$BUNDLE/tools"
            mkdir -p dist
      - longshot-builder:
          target: windows
          release: << parameters.release >>
          profile: dist
          sources: /tmp/sources.pack
          out: dist/longshot-builder-$TAG-windows-x64.exe
      - run:
          name: Check longshot-builder-<version>-windows-x64.exe
          command: |
            set -euo pipefail
            python3 -I scripts/longshot_builder.py check "dist/longshot-builder-$TAG-windows-x64.exe"
            ls -l dist
      # (what it carries is complete: unpacked, then a player's Windows build's dry run over it, by the Linux
      # longshot-builder: a file the program does not carry, or a third-party object a player's build would compile, fails
      # here)
      - run:
          name: A player's Windows build from what it carries
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            /tmp/host/longshot-builder dev release unpack /tmp/sources.pack /tmp/carried
            RX_TARGET=windows LONGSHOT_MINGW="$LLVM_MINGW" \
              /tmp/host/longshot-builder dev release dry-run /tmp/host/longshot-builder --root /tmp/carried --work /tmp/dry
      # (the program starts on Windows and unpacks what it carries into an empty cache: under Wine, its first start timed)
      - run:
          name: Its first start, under Wine
          command: |
            set -euo pipefail
            export WINEPREFIX=/tmp/wine WINEDEBUG=-all WINEDLLOVERRIDES="mshtml="
            wine="$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)"
            "$wine" "dist/longshot-builder-$TAG-windows-x64.exe" --version | tee /tmp/version.txt
            grep -q "^longshot-builder " /tmp/version.txt
            start=$(date +%s%N)
            "$wine" "dist/longshot-builder-$TAG-windows-x64.exe" sources --cache 'C:\longshot-cache'
            echo "first start: $(( ($(date +%s%N) - start) / 1000000 )) ms to unpack"
      # (dav1d for the AV1 movies is the bundle's CPM cache's: its library under the test of host/dav1d_av1.c, compiled
      # with the llvm-mingw above and run under Wine)
      - run:
          name: The bundle's dav1d, under Wine
          command: |
            set -euo pipefail
            dav1d=("$BUNDLE"/tools/cpm/dav1d/*)
            [ -f "${dav1d[0]}/lib/libdav1d.a" ] || { echo "the bundle's cpm has no dav1d"; exit 1; }
            export WINEPREFIX=/tmp/wine WINEDEBUG=-all WINEDLLOVERRIDES="mshtml="
            python3 -I -B tests/test_dav1d_av1.py --cross "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" \
              --run "$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)" --dav1d "${dav1d[0]}"
      - when:
          condition: << parameters.release >>
          steps:
            # (the release's stamps (the program run under Wine), the deltas from its channel's last releases and its
            # manifest for windows-x64)
            - run:
                name: The deltas and the manifest
                no_output_timeout: 30m
                command: |
                  set -euo pipefail
                  export WINEPREFIX=/tmp/wine WINEDEBUG=-all
                  /tmp/host/longshot-builder dev release files "dist/longshot-builder-$TAG-windows-x64.exe" --version "$TAG" \
                    --platform windows-x64 --work /tmp/release \
                    --runner "$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)"
            - persist_to_workspace:
                root: .
                paths:
                  - dist/longshot-builder-*-windows-x64*

  windows-vulkan:
    executor: py312-large
    retention:
      caches: 5d
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - llvm-mingw
      - run:
          name: Pinned header trees
          command: |
            set -euo pipefail
            scripts/fetch_commit.sh https://github.com/KhronosGroup/Vulkan-Headers 74d8a6cb930c68ef617b202c3ff3c59d919e086b _deps/cpm/vulkanheaders/v1.4.345
            scripts/fetch_commit.sh https://github.com/KhronosGroup/SPIRV-Headers 04f10f650d514df88b76d25e83db360142c7b174 _deps/cpm/spirv-headers/vulkan-sdk-1.4.341.0
            scripts/fetch_commit.sh https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator 1d8f600fd424278486eade7ed3e877c99f0846b1 _deps/cpm/vulkanmemoryallocator/v3.3.0
      - longshot-builder:
          target: linux
          profile: release
          out: /tmp/longshot-builder
      - restore_cache:
          keys:
            - v1-windows-vk-store-{{ checksum "/tmp/llvm-mingw-name" }}-{{ .Revision }}
            - v1-windows-vk-store-{{ checksum "/tmp/llvm-mingw-name" }}-
      - run:
          name: longshot_vk.dll (longshot-builder compile --only renderer)
          no_output_timeout: 30m
          environment:
            RX_TARGET: windows
            RX_RELEASE: "1"
          command: |
            set -euo pipefail
            LONGSHOT_MINGW="$LLVM_MINGW" RX_CPM="$PWD/_deps/cpm" /tmp/longshot-builder compile --only renderer --work /tmp/vk-work \
              --store "$HOME/vk-store" --root "$PWD" --jobs "$(nproc)"
            test -f /tmp/vk-work/build/longshot_vk.dll
            mb=$(du -sm "$HOME/vk-store" | cut -f1)
            if (( mb > 1536 )); then rm -rf "$HOME/vk-store"; mkdir -p "$HOME/vk-store"; echo "past 1.5 GB: the next run starts again"; fi
      - mb/save-cache-main:
          fork-pr: << pipeline.parameters.fork_pr >>
          git-branch: << pipeline.git.branch >>
          key: v1-windows-vk-store-{{ checksum "/tmp/llvm-mingw-name" }}-{{ .Revision }}
          paths: ~/vk-store

  vulkan-dlss:
    executor: py312-large
    retention:
      caches: 5d
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - llvm-mingw
      - run:
          name: Pinned header trees for Windows Vulkan
          command: |
            set -euo pipefail
            scripts/fetch_commit.sh https://github.com/KhronosGroup/Vulkan-Headers 74d8a6cb930c68ef617b202c3ff3c59d919e086b _deps/cpm/vulkanheaders/v1.4.345
            scripts/fetch_commit.sh https://github.com/KhronosGroup/SPIRV-Headers 04f10f650d514df88b76d25e83db360142c7b174 _deps/cpm/spirv-headers/vulkan-sdk-1.4.341.0
            scripts/fetch_commit.sh https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator 1d8f600fd424278486eade7ed3e877c99f0846b1 _deps/cpm/vulkanmemoryallocator/v3.3.0
            echo "export RX_TARGET=windows LONGSHOT_MINGW=$LLVM_MINGW" >> "$BASH_ENV"
      - run:
          name: NVIDIA DLSS SDK (this run only)
          command: python3 -I scripts/fetch.py dlss --platform windows --build-only --accept-nvidia-license /tmp/ngx-sdk
      - longshot-builder:
          target: linux
          profile: release
          out: /tmp/longshot-builder
      - run:
          name: longshot_vk.dll with NVIDIA DLSS and AMD FSR 4
          no_output_timeout: 45m
          environment:
            RX_RELEASE: "1"
          command: |
            set -euo pipefail
            RX_CPM="$PWD/_deps/cpm" \
              /tmp/longshot-builder compile --only renderer --work /tmp/vk-work --store /tmp/vk-store --root "$PWD" --jobs "$(nproc)" \
              --upscaler dlss,fsr4 --ngx-sdk /tmp/ngx-sdk | tee /tmp/vk-build.log
            test "${PIPESTATUS[0]}" -eq 0
            grep -q "the Vulkan back end: with NVIDIA DLSS" /tmp/vk-build.log
            grep -q "the Vulkan back end: with AMD FSR 4" /tmp/vk-build.log
      - run:
          name: Imports must stay Windows-only
          command: |
            set -euo pipefail
            dll=/tmp/vk-work/build/longshot_vk.dll
            "$LONGSHOT_MINGW/bin/llvm-objdump" -p "$dll" | sed -n 's/^ *\tDLL Name: //p' | tr -d '\r' | sort -u > /tmp/imports.txt
            if grep -viE '^(kernel32|user32|gdi32|advapi32)\.dll$|^api-ms-win-crt-[a-z0-9-]+\.dll$' /tmp/imports.txt; then
              echo "unexpected DLL imports"; exit 1
            fi

  website:
    executor: node22
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - website-pr-sources
      - run:
          name: npm ci (main lockfiles) and check (PR sources)
          working_directory: website
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            test -f package.json || { echo "no website/"; exit 0; }
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build # check-site.ts reads dist
            npm run check

  website-deploy:
    executor: node22
    steps:
      # plain checkout: this job holds cloudflare-prod and only runs on main, never on PR or fork code
      - checkout
      - run:
          name: wrangler deploy (production)
          working_directory: website
          command: |
            set -euo pipefail
            npm ci --no-audit --no-fund
            npm run build
            # dry-run until cutover: Forgejo's website.yml is still the live deployer (docs/dev/reference/ci.md)
            if [ "<< pipeline.parameters.release_dry_run >>" = true ]; then
              npx wrangler deploy --dry-run --message "main @ ${CIRCLE_SHA1:0:12}"
              exit 0
            fi
            npx wrangler deploy --message "main @ ${CIRCLE_SHA1:0:12}"
            # UNCONFIRMED: circleci run release / deploy tracking until a live pipeline with credentials.
      - run:
          name: Record deploy marker (advisory)
          when: always
          command: echo "Mark deploy in CircleCI Releases UI when CLI deploy tracking is verified (docs/dev/reference/ci.md)."

  website-preview-build:
    executor: node22
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - website-pr-sources
      - run:
          name: Build website for preview (no Cloudflare context)
          working_directory: website
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
      - persist_to_workspace:
          root: .
          paths:
            - website/dist

  website-preview-artifact:
    executor: node22
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - attach_workspace:
          at: .
      - run:
          name: Preview artifact (dist copy, root-relative links, URL)
          command: |
            set -euo pipefail
            test -d website/dist
            rm -rf /tmp/preview
            cp -a website/dist /tmp/preview
            find /tmp/preview -type f \( -name '*.html' -o -name '*.htm' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.xml' -o -name '*.json' \) \
              -exec sed -E -i 's/(href|src)=(["'\''])\/([^"'\''\/][^"'\'']*)\2/\1=\2\3\2/g' {} +
            printf '%s\n' \
              "https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/0/preview/index.html" \
              | tee preview-url.txt
      - store_artifacts:
          path: /tmp/preview
          destination: preview
      - persist_to_workspace:
          root: .
          paths:
            - preview-url.txt

  website-preview-comment:
    executor: node22
    steps:
      - attach_workspace:
          at: .
      - mb/preview-comment:
          repo: "<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>"
          pr: << pipeline.parameters.fork_pr >>
          commit-sha: "<< pipeline.parameters.fork_sha >>"
          preview-url-file: preview-url.txt

  release-version:
    executor: small
    steps:
      - checkout:
          method: full
      - fetch-release-history
      - main-release-py
      - rustup
      - run:
          name: Version (release.yml)
          command: |
            set -euo pipefail
            if ! cargo run --locked -q -p longshot-builder -- dev tools check --require; then
              echo "tools.lock lacks a required builder tool (RELEASING.md)"
              exit 1
            fi
            ref=$(git rev-parse HEAD)
            tag=""
            checked=""
            if [ -n "${CIRCLE_TAG:-}" ]; then
              tag="${CIRCLE_TAG}"
              python3 -I "$MAIN_RELEASE_PY" check-tag "$tag" --main origin/main
              checked=$(python3 -I "$MAIN_RELEASE_PY" released-as "$ref" --not "$tag")
              if [ -n "$checked" ] && [[ "$tag" == v* ]] && [[ "$checked" != v* ]]; then
                checked=""
              fi
            elif [ "<< pipeline.parameters.nightly >>" = true ]; then
              head=$(git rev-parse origin/main)
              if [ "$head" != "$ref" ]; then
                echo "main moved on: skip nightly for $ref"
                tag=""
              else
                last=$(git tag -l 'nightly-*' --sort=-version:refname | head -1)
                if [ -n "$last" ] && git diff --quiet "${last}^{commit}" HEAD -- . ':(exclude)docs/**' ':(exclude)*.md'; then
                  echo "no shipped changes since $last"
                  tag=""
                else
                  tag=$(python3 -I "$MAIN_RELEASE_PY" nightly-name)
                fi
              fi
            fi
            {
              echo "TAG=$tag"
              echo "REF=$ref"
              echo "CHECKED=$checked"
            } | tee release.env
      - persist_to_workspace:
          root: .
          paths:
            - release.env
            - tools.lock

  release-stage:
    # (release.yml's "The files": both platforms' programs, deltas and manifests, and tools.lock)
    # TODO(CI migration): no RecompLauncher zips here yet. Forgejo's release makes
    # longshot-builder-<v>-<p>-recomplauncher.zip in each build job, right after `dev release files`
    # (.forgejo/workflows/build-linux.yml, build-windows.yml: `longshot-builder dev release recomplauncher <full file>
    # --out dist`), and its publish requires them (.forgejo/workflows/release.yml, "The files"). Do the same in the build
    # jobs' release mode before a CircleCI release replaces Forgejo's, or its releases ship no RecompLauncher file.
    executor: small
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Collect release artifacts into files/
          command: |
            set -euo pipefail
            . release.env
            if [ -z "${TAG:-}" ]; then
              circleci-agent step halt
            fi
            rm -rf files
            mkdir -p files
            cp -a dist/. files/
            cp -a tools.lock files/
            ls -la files/
            for p in linux-x64 windows-x64; do
              exe=; [ "$p" = windows-x64 ] && exe=.exe
              test -f "files/longshot-builder-$TAG-$p$exe" || { echo "no files/longshot-builder-$TAG-$p$exe"; exit 1; }
              test -f "files/longshot-builder-$TAG-$p.json" || { echo "no files/longshot-builder-$TAG-$p.json"; exit 1; }
            done
      - persist_to_workspace:
          root: .
          paths:
            - files
            - release.env
