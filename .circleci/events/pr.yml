# Same-repo pull request (mb/setup path-filter). Docs: docs/dev/reference/ci.md.
workflows:
  ci:
    jobs:
      - lint
      - third-party
      - guide-screenshots
      - test-linux:
          requires: [lint]
          filters: >-
            pipeline.parameters.tests or pipeline.parameters.full
      - rust:
          requires: [lint]
          filters: pipeline.parameters.tests or pipeline.parameters.full
      - e2e:
          requires: [lint]
          filters: pipeline.parameters.tests or pipeline.parameters.full
      - host-windows:
          requires: [lint]
          filters: >-
            pipeline.parameters.tests or pipeline.parameters.windows or pipeline.parameters.full
      - spirv-fixtures:
          requires: [lint]
          filters: pipeline.parameters.gpu or pipeline.parameters.full
      - linux-longshot-builder:
          requires: [lint, test-linux, spirv-fixtures]
          filters: pipeline.parameters.linux or pipeline.parameters.full
      - windows-longshot-builder:
          requires: [lint]
          filters: pipeline.parameters.windows or pipeline.parameters.full
      - windows-vulkan:
          requires: [lint, spirv-fixtures]
          filters: >-
            pipeline.parameters.gpu or pipeline.parameters.windows
            or pipeline.parameters.full
      - website:   # (always: its checks run on every change; the preview or deploy only when the site's sources change)
      - website-preview-build:
          requires: [website]
          filters: pipeline.parameters.website
      - website-preview-artifact:
          requires: [website-preview-build]
          filters: pipeline.parameters.website
      - website-preview-comment:
          context: forgejo-comment
          requires: [website-preview-artifact]
          filters: pipeline.parameters.website
      - mb/gate:
          name: gate
          requires:
            - lint
            - third-party
            - guide-screenshots
            - test-linux
            - rust
            - e2e
            - host-windows
            - spirv-fixtures
            - linux-longshot-builder
            - windows-longshot-builder
            - windows-vulkan
            - website
            - website-preview-build
            - website-preview-artifact
