# Push to main (not a schedule or tag pipeline).
workflows:
  ci:
    jobs:
      - lint
      - third-party
      - guide-screenshots
      - test-linux:
          requires: [lint]
      - rust:
          requires: [lint]
      - e2e:
          requires: [lint]
      - host-windows:
          requires: [lint]
      - spirv-fixtures:
          requires: [lint]
      - linux-longshot-builder:
          requires: [lint, test-linux, spirv-fixtures]
          filters: pipeline.parameters.linux or pipeline.parameters.full
      - windows-longshot-builder:
          requires: [lint]
          filters: pipeline.parameters.windows or pipeline.parameters.full
      - windows-vulkan:
          requires: [lint, spirv-fixtures]
          filters: >-
            pipeline.parameters.gpu or pipeline.parameters.windows
            or pipeline.parameters.full
      - website:   # (always: its checks run on every change; the preview or deploy only when the site's sources change)
      - website-deploy:
          context: cloudflare-prod
          requires: [website]
          filters: pipeline.parameters.website
      - release-version:
          requires:
            - lint
            - third-party
            - test-linux
            - rust
            - e2e
            - host-windows
            - spirv-fixtures
            - linux-longshot-builder
            - windows-longshot-builder
            - windows-vulkan
      - linux-longshot-builder:
          name: release-linux-longshot-builder
          release: true
          requires: [release-version]
      - windows-longshot-builder:
          name: release-windows-longshot-builder
          release: true
          requires: [release-version]
      - release-stage:
          requires: [release-linux-longshot-builder, release-windows-longshot-builder]
      - mb/release-sign:
          name: release-sign
          context: release-signing
          workspace: .
          dry-run: << pipeline.parameters.release_dry_run >>
          requires: [release-stage]
      - mb/release-publish:
          name: release-publish
          context: forgejo-bot
          serial-group: << pipeline.project.slug >>/release
          workspace: .
          dry-run: << pipeline.parameters.release_dry_run >>
          requires: [release-sign]
      - mb/gate:
          name: gate
          requires:
            - lint
            - third-party
            - guide-screenshots
            - test-linux
            - rust
            - e2e
            - host-windows
            - spirv-fixtures
            - linux-longshot-builder
            - windows-longshot-builder
            - windows-vulkan
            - website
            - website-deploy
            - release-publish
