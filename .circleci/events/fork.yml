# Fork PR pipeline (fork_pr / fork_sha from mb/fork-doorbell). Docs: docs/dev/reference/ci.md.
workflows:
  fork-pr:
    when: pipeline.parameters.fork_pr > 0
    jobs:
      - lint:
          name: fork-lint
      - third-party:
          name: fork-third-party
          requires: [fork-lint]
      - guide-screenshots:
          name: fork-guide-screenshots
          requires: [fork-lint]
      - fork-test-linux:
          requires: [fork-lint]
          filters: pipeline.parameters.tests or pipeline.parameters.full
      - rust:
          name: fork-rust
          requires: [fork-lint]
          filters: pipeline.parameters.tests or pipeline.parameters.full
      - e2e:
          name: fork-e2e
          requires: [fork-lint]
          filters: pipeline.parameters.tests or pipeline.parameters.full
      - host-windows:
          name: fork-host-windows
          requires: [fork-lint]
          filters: >-
            pipeline.parameters.tests or pipeline.parameters.windows or pipeline.parameters.full
      - spirv-fixtures:
          name: fork-spirv-fixtures
          requires: [fork-lint]
          filters: pipeline.parameters.gpu or pipeline.parameters.full
      - linux-longshot-builder:
          name: fork-linux-longshot-builder
          requires: [fork-lint, fork-test-linux, fork-spirv-fixtures]
          filters: pipeline.parameters.linux or pipeline.parameters.full
      - windows-longshot-builder:
          name: fork-windows-longshot-builder
          requires: [fork-lint]
          filters: pipeline.parameters.windows or pipeline.parameters.full
      - windows-vulkan:
          name: fork-windows-vulkan
          requires: [fork-lint, fork-spirv-fixtures]
          filters: >-
            pipeline.parameters.gpu or pipeline.parameters.windows
            or pipeline.parameters.full
      - mb/gate:
          name: fork-gate
          requires:
            - fork-lint
            - fork-third-party
            - fork-guide-screenshots
            - fork-test-linux
            - fork-rust
            - fork-e2e
            - fork-host-windows
            - fork-spirv-fixtures
            - fork-linux-longshot-builder
            - fork-windows-longshot-builder
            - fork-windows-vulkan
      - mb/fork-report:
          repo: "<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>"
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          name: fork-report-ok
          state: success
          context: forgejo-bot
          requires: [fork-gate]
      - mb/fork-report:
          repo: "<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>"
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          name: fork-report-fail
          state: failure
          context: forgejo-bot
          requires:
            - fork-gate:
                - not_run
                - failed
                - canceled
