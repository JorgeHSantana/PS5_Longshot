# Release tag v* workflow: the core checks and the Windows Vulkan back end pass before anything is built; each platform's
# longshot-builder is checked (its dry run, Wine) in the job that builds it, before anything is signed or published. Docs: docs/dev/reference/ci.md.
workflows:
  release:
    jobs:
      - lint:
          filters: (pipeline.git.tag or "") starts-with "v"
      - third-party:
          filters: (pipeline.git.tag or "") starts-with "v"
      - test-linux:
          requires: [lint]
          filters: (pipeline.git.tag or "") starts-with "v"
      - rust:
          requires: [lint]
          filters: (pipeline.git.tag or "") starts-with "v"
      - host-windows:
          requires: [lint]
          filters: (pipeline.git.tag or "") starts-with "v"
      - spirv-fixtures:
          requires: [lint]
          filters: (pipeline.git.tag or "") starts-with "v"
      - windows-vulkan:
          requires: [lint, spirv-fixtures]
          filters: (pipeline.git.tag or "") starts-with "v"
      - release-version:
          requires: [lint, third-party, test-linux, rust, host-windows, spirv-fixtures, windows-vulkan]
          filters: (pipeline.git.tag or "") starts-with "v"
      - linux-longshot-builder:
          name: release-linux-longshot-builder
          release: true
          requires: [release-version]
          filters: (pipeline.git.tag or "") starts-with "v"
      - windows-longshot-builder:
          name: release-windows-longshot-builder
          release: true
          requires: [release-version]
          filters: (pipeline.git.tag or "") starts-with "v"
      - release-stage:
          requires: [release-linux-longshot-builder, release-windows-longshot-builder]
          filters: (pipeline.git.tag or "") starts-with "v"
      - mb/release-sign:
          name: release-sign
          context: release-signing
          workspace: .
          dry-run: << pipeline.parameters.release_dry_run >>
          requires: [release-stage]
          filters: (pipeline.git.tag or "") starts-with "v"
      - mb/release-publish:
          name: release-publish
          context: forgejo-bot
          serial-group: << pipeline.project.slug >>/release
          tag: << pipeline.git.tag >>
          workspace: .
          dry-run: << pipeline.parameters.release_dry_run >>
          requires: [release-sign]
          filters: (pipeline.git.tag or "") starts-with "v"
      - mb/gate:
          name: gate
          requires: [release-publish]
          filters: (pipeline.git.tag or "") starts-with "v"
